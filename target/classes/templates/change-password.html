<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Change Password</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-light">

	<div th:replace="~{fragments/navbar :: navbar}"></div>

	<div class="container py-5">

		<div class="row justify-content-center">

			<div class="col-md-6">

				<div class="card shadow-lg border-0 rounded-4">

					<div class="card-body p-5">

						<div class="text-center mb-4">

							<i class="bi bi-shield-lock display-1 text-danger"></i>

							<h2 class="fw-bold mt-3">Change Password</h2>

						</div>
						<div th:if="${param.success}" class="alert alert-success">
							<i class="bi bi-check-circle-fill"></i> Password changed
							successfully.
						</div>
						<div th:if="${param.error=='current'}" class="alert alert-danger">
							<i class="bi bi-exclamation-circle-fill"></i> Current password is
							incorrect.
						</div>
						<div th:if="${param.error=='confirm'}" class="alert alert-warning">
							<i class="bi bi-exclamation-triangle-fill"></i> New Password and
							Confirm Password do not match.
						</div>

						<form th:action="@{/profile/change-password}" method="post">

							<div class="mb-3">
								<label class="form-label">Current Password</label> <input
									type="password" class="form-control" name="currentPassword"
									required>
							</div>

							<div class="mb-3">
								<label class="form-label">New Password</label> <input
									type="password" class="form-control" name="newPassword"
									required>
							</div>

							<div class="mb-4">
								<label class="form-label">Confirm Password</label> <input
									type="password" class="form-control" name="confirmPassword"
									required>
							</div>

							<button class="btn btn-danger w-100">
								<i class="bi bi-key-fill"></i> Update Password
							</button>

						</form>

					</div>

				</div>

			</div>

		</div>

	</div>

</body>
</html>
