<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<title>Expenses</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

	<div th:replace="~{fragments/navbar :: navbar}"></div>

	<div class="container mt-4">

		<div class="d-flex justify-content-between align-items-center mb-4">

			<h2>
				<i class="bi bi-cash-stack"></i> Expenses
			</h2>


			<div class="d-flex justify-content-between align-items-center mb-3">

				<div>

					<a href="/expenses" class="btn btn-dark btn-sm">All</a> <a
						href="/expenses/today" class="btn btn-outline-primary btn-sm">Today</a>

					<a href="/expenses/week" class="btn btn-outline-success btn-sm">This
						Week</a> <a href="/expenses/month"
						class="btn btn-outline-warning btn-sm">This Month</a>

				</div>
				<div class="d-flex align-items-center gap-2">

					<form th:action="@{/expenses}" method="get" class="d-flex">

						<div class="input-group">

							<span class="input-group-text"> <i class="bi bi-search"></i>
							</span> <input type="search" name="keyword" class="form-control"
								placeholder="Search Expense..." th:value="${keyword}">

						</div>

					</form>

					<a href="/expenses" class="btn btn-secondary"> Clear </a> <a
						th:href="@{/expenses/add}" class="btn btn-primary"> <i
						class="bi bi-plus-circle"></i> Add Expense
					</a>

				</div>

			</div>
		</div>

		<div class="card shadow">

			<div class="card-body">

				<table class="table table-bordered table-hover align-middle">

					<thead class="table-dark">

						<tr>

							<th>Expense Name</th>
							<th>Category</th>
							<th>Amount</th>
							<th>Date</th>
							<th>Actions</th>

						</tr>

					</thead>

					<tbody>

						<tr th:if="${#lists.isEmpty(expenses)}">
							<td colspan="5" class="text-center py-4 text-muted"><i
								class="bi bi-search fs-2"></i> <br> No expenses found.</td>
						</tr>

						<tr th:each="expense : ${expenses}">
						<tr th:each="expense : ${expenses}">

							<td th:text="${expense.title}"></td>

							<td th:text="${expense.category.name}"></td>

							<td><strong>₹ <span th:text="${expense.amount}"></span></strong>
							</td>

							<td th:text="${expense.date}"></td>

							<td><a th:href="@{/expenses/edit/{id}(id=${expense.id})}"
								class="btn btn-warning btn-sm"> <i
									class="bi bi-pencil-square"></i> Edit

							</a> <a th:href="@{/expenses/delete/{id}(id=${expense.id})}"
								class="btn btn-danger btn-sm"
								onclick="return confirm('Delete this expense?')"> <i
									class="bi bi-trash"></i> Delete

							</a></td>

						</tr>

					</tbody>

				</table>

			</div>

		</div>
	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
