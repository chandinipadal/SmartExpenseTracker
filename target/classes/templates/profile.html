<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>My Profile</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

<link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow border-0 rounded-4">

                <div class="card-body text-center p-5">

                    <i class="bi bi-person-circle display-1 text-primary"></i>

                    <h2 class="fw-bold mt-3">My Profile</h2>

                    <hr>

                    <div class="text-start mt-4">

                        <p class="fs-5">
                            <strong><i class="bi bi-person-fill"></i> Name :</strong>
                            <span th:text="${user.name}"></span>
                        </p>

                        <p class="fs-5">
                            <strong><i class="bi bi-envelope-fill"></i> Email :</strong>
                            <span th:text="${user.email}"></span>
                        </p>
                        
                        <div class="d-flex justify-content-center gap-3 mt-4">

   <div class="d-flex justify-content-center gap-3 mt-4">

    <a th:href="@{/profile/edit}" class="btn btn-success px-4">
        <i class="bi bi-pencil-square"></i>
        Edit Profile
    </a>

    <a th:href="@{/profile/change-password}" class="btn btn-danger px-4">
        <i class="bi bi-key-fill"></i>
        Change Password
    </a>

</div>

</div>

                    </div>

                    <a th:href="@{/dashboard}"
                        class="btn btn-dark rounded-pill px-4 mt-4">

                        <i class="bi bi-house-door-fill"></i>
                        Back to Dashboard

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
